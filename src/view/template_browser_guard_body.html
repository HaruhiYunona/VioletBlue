<section id="browser-compatibility" class="browser-warning" role="alert" aria-labelledby="browser-warning-title">
    <div class="browser-warning-cell"><div class="browser-warning-card">
        <span class="browser-warning-icon" aria-hidden="true">!</span>
        <h1 id="browser-warning-title">请更新浏览器</h1>
        <p>当前浏览器暂不支持此网站所需的功能。请更新浏览器后重新打开，或换用其他新版浏览器访问。</p>
        <div class="browser-warning-links">
            <a href="https://www.microsoft.com/edge" target="_blank" rel="noopener noreferrer">Microsoft Edge</a>
            <a href="https://www.google.com/chrome/" target="_blank" rel="noopener noreferrer">Google Chrome</a>
            <a href="https://www.mozilla.org/firefox/new/" target="_blank" rel="noopener noreferrer">Firefox</a>
        </div>
        <button type="button" onclick="location.reload()">更新后重新检测</button>
        <p class="browser-warning-note">手机可通过应用商店更新浏览器；Safari 请通过系统更新升级。</p>
    </div></div>
</section>
