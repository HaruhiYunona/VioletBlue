# 对应旧版桌面与手机版 :root 的全部颜色变量。
# 主题仅作用于前台及配色页的前台预览；后台使用独立固定配色。
# 旧的登录、后台表单、上传等颜色键仅保留配置值，不再影响后台。
# 手机歌曲单元格：card 为含标签的卡片，compact 为参考站的紧凑单行。
mobile_song_style: card
# 电脑端右栏卡片独立开关；不影响手机和平板。
desktop_show_profile: true
desktop_show_search: true
desktop_show_notice: true
desktop_show_tags: true
--title: '#000000'
--line-color: '#8a2be2'
--all-text: '#808080'
--scroll-bar: 'rgba(138,43,226,0.2)'
--tag-text: '#562385'
--tag-background: 'rgba(138,43,226,0.2)'
--song-card: 'rgba(249,216,255,0.25)'
--song-card-claim: 'rgba(249,216,255,0.7)'
--type: '#d8bfd8'
--type-selected: '#9370db'
--button-color: '#9370db'
--bio-card: 'rgba(138,43,226,0.2)'
